<!doctype html>
<html lang="pt"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>O que é ser humano? v1.0</title>
<style>
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#B8B3A3}
body{display:grid;grid-template-rows:142px minmax(0,1fr) 56px}
iframe{display:block;width:100%;height:100%;min-width:0;min-height:0;border:0}
@media(max-width:700px){body{grid-template-rows:104px minmax(0,1fr) calc(104px + env(safe-area-inset-bottom,0px))}}
</style>
<script>addEventListener('message',function(e){if(e.data==='ser-h:print'){document.querySelector('iframe[name="central"]').contentWindow.postMessage('ser-h:print-page','*');}else if(e.data==='ser-h:back'){history.back();}else if(e.data==='ser-h:forward'){history.forward();}});</script>
</head><body>
<iframe name="cimo" src="file-005.html?layout=2" title="Cabeçalho / Header" scrolling="no"></iframe>
<iframe name="central" src="file-006.html?layout=2" title="Conteúdo / Content"></iframe>
<iframe name="fundo" src="file-007.html?layout=2" title="Navegação / Navigation" scrolling="no"></iframe>
</body></html>
